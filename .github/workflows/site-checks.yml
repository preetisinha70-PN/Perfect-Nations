# Temporary checks of the live site from GitHub's servers (12 Nov 2026, sitemap and robots). Runs only on the site-checks branch.
name: site-checks
on:
  push:
    branches: [site-checks]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in https://perfectnations.com/robots.txt https://perfectnations.com/sitemap_index.xml https://perfectnations.com/sitemap.xml https://perfectnations.com/wp-sitemap.xml; do
            echo "=== $u"; curl -s -A "$UA" -o /tmp/s -m 30 -w 'status %{http_code} -> %{redirect_url} %{content_type}\n' "$u"; head -c 900 /tmp/s | tr '\n' ' ' | sed 's/<sitemap>/\n  <sitemap>/g' | head -12; echo; echo "  .org mentions: $(grep -o 'perfectnations\.org' /tmp/s | wc -l)  .com mentions: $(grep -o 'perfectnations\.com' /tmp/s | wc -l)"
          done
          echo "=== a child sitemap"; c=$(grep -o 'https://perfectnations\.com/[a-z_-]*sitemap[0-9]*\.xml' /tmp/s 2>/dev/null | head -1); curl -s -A "$UA" -o /tmp/c -m 30 -w "$c status %{http_code}\n" "${c:-https://perfectnations.com/page-sitemap.xml}"; echo "  urls: $(grep -c '<loc>' /tmp/c)  .org: $(grep -o 'perfectnations\.org' /tmp/c | wc -l)"

# Temporary checks of the live site from GitHub's servers (19 Nov 2026, the wp-*.php 403). Runs only on the site-checks branch.
name: site-checks
on:
  push:
    branches: [site-checks]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in 'https://perfectnations.com/wp-*.php' 'https://perfectnations.com/wp-%2A.php' 'https://perfectnations.com/wp-nothing-here.php' 'https://perfectnations.com/'; do
            curl -s -g -A "$UA" -o /tmp/b -D /tmp/h -m 30 -w "$u -> %{http_code}\n" "$u"; grep -i -E '^(server|x-hcdn-cache-status|x-litespeed|x-powered-by):' /tmp/h | sed 's/^/   /'
          done
          echo "== where wp-*.php appears in the homepage"
          curl -s -A "$UA" -m 30 https://perfectnations.com/ | grep -o '.\{160\}wp-\*\.php.\{80\}' | head -3
          echo "== robots.txt"; curl -s -A "$UA" -m 30 https://perfectnations.com/robots.txt

# Temporary checks of the live site from GitHub's servers (12 Nov 2026, Change of Address fetch). Runs only on the site-checks branch.
name: site-checks
on:
  push:
    branches: [site-checks]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for d in perfectnations.org www.perfectnations.org perfectnations.com; do
            echo "=== DNS $d"; echo "  A:    $(dig +short A $d | tr '\n' ' ')"; echo "  AAAA: $(dig +short AAAA $d | tr '\n' ' ')"; echo "  CNAME: $(dig +short CNAME $d | tr '\n' ' ')"
          done
          echo "  NS org: $(dig +short NS perfectnations.org | tr '\n' ' ')"
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "Mozilla/5.0 (compatible; Google-InspectionTool/1.0;)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "curl/8"; do
            echo; echo "##### UA: $ua"
            for u in http://perfectnations.org/ https://perfectnations.org/ http://www.perfectnations.org/ https://www.perfectnations.org/; do
              curl -s -A "$ua" -o /tmp/b -D /tmp/h -m 30 -w "$u -> %{http_code} %{redirect_url}  (time %{time_total}s)\n" "$u"
              grep -i -E '^(server|location|x-hcdn|platform|cache|x-litespeed|content-length):' /tmp/h | sed 's/^/     /'
              [ "$(head -c1 /tmp/b)" ] && head -c 200 /tmp/b | tr '\n' ' ' | sed 's/^/     body: /' && echo
            done
          done
          echo; echo "##### robots.txt"
          for u in http://perfectnations.org/robots.txt https://perfectnations.org/robots.txt https://perfectnations.com/robots.txt; do curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36" -o /tmp/r -m 30 -w "$u -> final %{url_effective} %{http_code} hops %{num_redirects}\n" "$u"; head -c 400 /tmp/r | sed 's/^/     /'; echo; done
          echo; echo "##### full chain with Googlebot UA from http://perfectnations.org/"
          curl -s -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -L -o /dev/null -m 40 -w "final %{url_effective} %{http_code} hops %{num_redirects}\n" http://perfectnations.org/
          curl -sv -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -o /dev/null -m 20 http://perfectnations.org/ 2>&1 | grep -E '^(\*   Trying|\* Connected|< )' | head -20

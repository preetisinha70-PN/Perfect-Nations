# Temporary speed probe (6 Nov 2026). Runs only on this branch; the branch is deleted afterwards.
name: speed-probe
on:
  push:
    branches: [speed-probe-2026-11-06]
permissions:
  contents: write
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'probe results') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every live page twice, then again after 11 minutes
        run: |
          set +e
          mkdir -p probe-out/pages
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36"
          ACC="text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
          pass(){ # $1 = label
            while read -r u; do
              [ -z "$u" ] && continue
              n=$(echo "$u" | sed 's#https://perfectnations.org/##; s#/$##; s#/#_#g'); [ -z "$n" ] && n=home
              out=/dev/null; [ "$1" = A ] && out=probe-out/pages/$n.html
              r=$(curl -s --compressed -A "$UA" -H "Accept: $ACC" -D /tmp/h -o "$out" -w "%{http_code} %{time_starttransfer} %{size_download}" "$u")
              c=$(grep -i '^x-litespeed-cache:' /tmp/h | tr -d '\r' | awk '{print $2}'); a=$(grep -i '^age:' /tmp/h | tr -d '\r' | awk '{print $2}')
              echo "$1 $n $r cache=${c:-none} age=${a:--}" | tee -a probe-out/cache.txt
            done < probe-urls.txt
          }
          pass A; pass B; sleep 660; pass C
      - name: Commit results to this branch
        run: |
          git config user.name "speed-probe"; git config user.email "noreply@github.com"
          git add probe-out && git commit -q -m "probe results" && git push -q

# Temporary check (7 Nov 2026): do pages stay cached past ten minutes now? Runs only on this branch.
name: speed-probe
on:
  push:
    branches: [speed-probe-2026-11-06]
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'remove the probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36"
          ACC="text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
          check(){ for path in / /blueprints/ /about/ /state-of-nations/ /blueprints/kenya/ /blueprints/barbados/ /blueprints/ghana/ /blueprints/fiji/ /dear-kenya/; do
              r=$(curl -s -o /dev/null --compressed -A "$UA" -H "Accept: $ACC" -D /tmp/h -w "%{http_code} %{time_starttransfer}" "https://perfectnations.org${path}")
              c=$(grep -i '^x-litespeed-cache:' /tmp/h | tr -d '\r' | awk '{print $2}'); a=$(grep -i '^age:' /tmp/h | tr -d '\r' | awk '{print $2}')
              echo "$1 $path $r cache=${c:-none} age=${a:--}"; sleep 1; done; }
          check NOW; sleep 720; check AFTER12MIN

# Temporary (run 2, HUD counts): official downloads for the Perfect States blueprints (Connecticut, Alaska, New Mexico, Texas, Mississippi).
# Census ACS, Census county outlines (GENZ2024), NAEP 2024, HUD Point-in-Time counts, USDA SNAP payment error rates,
# CBPP SNAP cost-shift table. Branch only: the files are copied into the blueprint pull request, then this branch can go.
name: perfect-states-data
on:
  push:
    branches: [perfect-states-data-2026-11-25]
    paths: ['.github/workflows/perfect-states-data.yml']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set +e
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1
          pip install -q pyshp openpyxl pyxlsb >/dev/null 2>&1
          R=data/us/raw
          mkdir -p $R/_shared /tmp/pn
          get(){ for i in 1 2 3; do curl -sSL -m 300 -A "Mozilla/5.0 PerfectNations-data" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" && [ -s "$1" ] && head -c 1 "$1" | grep -q . && return 0; sleep 5; done; return 1; }
          # HUD Point-in-Time counts by state (run 2: the file is .xlsb), and the AHAR 2025 Part 1 report
          get /tmp/pn/pit.xlsb "https://www.huduser.gov/portal/sites/default/files/xls/2007-2025-PIT-Counts-by-State.xlsb"
          python3 - <<'PY'
          from pyxlsb import open_workbook
          with open_workbook('/tmp/pn/pit.xlsb') as wb:
              print(wb.sheets[:5])
              out = open('data/us/raw/_shared/hud-pit-2025-by-state.txt', 'w')
              with wb.get_sheet('2025') as sh:
                  for i, row in enumerate(sh.rows()):
                      vals = [('' if c.v is None else str(c.v)) for c in row[:5]]
                      if i == 0 or (vals and vals[0] in ('State', 'Total', 'CT', 'AK', 'NM', 'TX', 'MS', 'NY')):
                          out.write('|'.join(vals) + '\n')
          PY
          get /tmp/pn/ahar25.pdf "https://www.huduser.gov/portal/sites/default/files/pdf/2025-AHAR-Part-1.pdf" && pdftotext -layout /tmp/pn/ahar25.pdf /tmp/pn/ahar25.txt && grep -n -E '^ *(Connecticut|Alaska|New Mexico|Texas|Mississippi|New York) ' /tmp/pn/ahar25.txt | head -40 > $R/_shared/hud-ahar-2025-part1-state-lines.txt
          for d in $R/_shared; do for f in $d/*; do echo "$f $(wc -c < "$f")"; done; done > $R/_shared/manifest-2026-11-25-run2.txt
          date -u +%Y-%m-%dT%H:%MZ > $R/_shared/pulled-at-2026-11-25-run2.txt
          cat $R/_shared/manifest-2026-11-25-run2.txt
      - name: Commit
        run: |
          git config user.name "Perfect Nations data"
          git config user.email "actions@users.noreply.github.com"
          git add data/us/raw
          git commit -m "Data: official downloads for the Perfect States blueprints (CT, AK, NM, TX, MS)" || echo nothing
          git push

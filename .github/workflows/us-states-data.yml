# Temporary (check 1): is perfectnations.org/50-states/ live and served from GitHub? Reads the page only.
name: us-states-data
on:
  push:
    branches: [us-states-data-2026-11-10]
    paths: ['.github/workflows/us-states-data.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        run: |
          for u in "https://perfectnations.org/50-states/" "https://perfectnations.org/50-states/?pnv=$(date +%s)" "https://perfectnations.org/"; do
            code=$(curl -sSL -m 60 -A "Mozilla/5.0 (PerfectNations check)" -o page.html -w '%{http_code}' "$u")
            echo "== $u -> HTTP $code, $(wc -c < page.html) bytes"
            echo "pn-us root: $(grep -c 'id="pn-us"' page.html)  page v1.0 (hero): $(grep -c 'pnus-hero' page.html)  map states: $(grep -o 'class="pnus-st"' page.html | wc -l)  fallback: $(grep -c 'blueprints of the American states are opening' page.html)"
            echo "menu link: $(grep -c 'perfectnations.org/50-states/' page.html)  title: $(grep -o '<title>[^<]*' page.html | head -1)"
          done

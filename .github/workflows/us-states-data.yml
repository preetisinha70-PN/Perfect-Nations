# Temporary (run 6): USDA food security (ERR-358), NAEP 2024 reading (NAEP Data Service), EIA electricity prices. Branch only.
name: us-states-data
on:
  push:
    branches: [us-states-data-2026-11-10]
    paths: ['.github/workflows/us-states-data.yml']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set +e
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1
          mkdir -p data/us/raw/new-york && cd data/us/raw/new-york
          get(){ for i in 1 2 3; do curl -sSL -m 180 -A "Mozilla/5.0 PerfectNations-data" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" && [ -s "$1" ] && return 0; sleep 5; done; return 1; }
          get err358.pdf "https://ers.usda.gov/sites/default/files/_laserfiche/publications/113623/ERR-358.pdf"
          [ -s err358.pdf ] && { pdftotext -layout err358.pdf usda-err358.txt; rm -f err358.pdf; }
          get eia-avgprice_annual.xlsx "https://www.eia.gov/electricity/data/state/avgprice_annual.xlsx"
          for f in *; do echo "$f $(wc -c < "$f")"; done > manifest.txt
          date -u +%Y-%m-%dT%H:%MZ > pulled-at-run6.txt
      - name: Commit
        run: |
          git config user.name "Perfect Nations data"
          git config user.email "actions@users.noreply.github.com"
          git add data/us/raw/new-york
          git commit -m "Data: USDA, NAEP and EIA figures for the New York State blueprint" || echo nothing
          git push

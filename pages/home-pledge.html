<style>
#pn-pledge{
  --bg:#164A37; --bg2:#0A251C;

  --acc:#E3C258; --accs:#F0D68F; --accrgb:227,194,88; --onacc:#1A140C;

}
#pn-pledge *,#pn-pledge *::before,#pn-pledge *::after{ box-sizing:border-box; }
.elementor-widget-html:has(#pn-pledge),
.elementor-widget:has(#pn-pledge),
.e-con-inner:has(#pn-pledge),
.e-con:has(#pn-pledge){

}
#pn-pledge .pnpl-in{

}
#pn-pledge h2.pnpl-h{

  font-size:clamp(1.6rem,2.6vw,2.4rem); line-height:1; letter-spacing:-.015em;
  color:var(--fg) !important; text-transform:none;
}
#pn-pledge .pnpl-line{ margin:8px 0 0; max-width:none; text-wrap:balance; font-size:clamp(.95rem,1.1vw,1.05rem); line-height:1.45; color:var(--mut); }

#pn-pledge .pnpl-btn{

}

#pn-pledge .pnpl-btn:hover{ transform:translateY(-2px); background:var(--accs); border-color:var(--accs); }

#pn-pledge .pnpl-btn:focus-visible{ outline:2px solid var(--accs); outline-offset:3px; }
#pn-pledge .pnpl-btn--line{ background:transparent; color:var(--acc); border-color:rgba(var(--accrgb),.6); box-shadow:none; }
#pn-pledge .pnpl-btn--line:hover{ background:rgba(var(--accrgb),.12); color:var(--acc); }

#pn-pledge{ --bg:#0F4C5C; --bg2:#082A30; }

<!-- ==========================================================================
PERFECT NATIONS - CUSTOM HEADER - v19.1 EARTHRISE - 2026-11-05
v19.1: the cup mark (the championship cup of the logo between two short solid lines on each side)
replaces the laurels and star in the open menu, and, through one sitewide rule, on every
page that still carries the old laurel drawing.
v19.0: the bar turns Earthrise (#0B3D45), the deep blue-green of the Earth as seen
from the Moon. The open menu runs from Lagoon (#0F4C5C) down to Earthrise Depth
(#082A30). The menu button and the cart now light up in Lagoon on hover.
The laurel in the open menu draws both stems in gold (the mirrored stem showed black).
The logo is the new seven-star mark (one star for each of the seven standards),
uploaded to the media library on 5 November 2026; if it cannot load, the earlier
five-star file shows instead. Nothing else changes: the same menu, links, markup and script.
v18.9: Perfect Nations Gallery links to /perfect-nations-gallery/.
v18.8: The Collection becomes Perfect Nations Gallery (/gallery/); About (/about/) and
Contact (/contact/) are added after State of Nations.
v18.7: Blueprints is a plain menu item again; the list of nation names under it
is removed (the ticker and the Blueprints page carry them). The cart is checked
only when the visitor has something in it, so most page views make no extra
server request.
v18.6: the Gallery menu item becomes The Collection (/collection/).
v18.5: the Perfect Capita menu item keeps its name.
v18.4: Brazil added under the Americas.
v18.2: Dispatches and Newswire become one page, State of Nations (/state-of-nations/).
Earthrise bar. Mark and name on the left, one menu control on the right.
The panel colors each destination with the earth of its homepage section.
Gold is used only for the name, which links home, and the one call to action.

OPTIONAL: add pn-hd--float to the header tag to lay the bar over the page,
transparent at the top and solid Earthrise once scrolled.
Still true: no blur behind the bar, no filters or transforms on the bar, forms use
aria-label (not role="search"), and everything works with the script removed.
=========================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">

<style>
.pn-hd{
  --pn-gold:var(--pn-brand-gold,#E3C258);
  --pn-gold-rgb:var(--pn-brand-gold-rgb,227,194,88);
  /* v19.0 Earthrise: bar, open state, depth, and Lagoon for hovers */
  --pn-sea:#0B3D45;
  --pn-sea-2:#093239;
  --pn-sea-3:#082A30;
  --pn-lagoon:#0F4C5C;
  --pn-on-gold:#1A140C;
  --pn-ink:#F5F1E8;
  --pn-ink-dim:rgba(245,241,232,.78);
  --pn-ink-low:rgba(245,241,232,.60);
  --pn-hair:rgba(245,241,232,.14);
  --pn-head:var(--pn-font-heading,'Barlow Condensed','Arial Narrow',Arial,sans-serif);
  --pn-body:var(--pn-font-body,'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif);

  position:relative; z-index:9990;
  background:var(--pn-sea);
  border-bottom:1px solid transparent;
  font-family:var(--pn-head);
  transition:background .3s ease, border-color .3s ease;
}
.pn-hd--scrolled{ background:rgba(11,61,69,.97); border-bottom-color:var(--pn-hair); }
.pn-hd:has(.pn-hd__toggle:checked){ background:var(--pn-sea-2); border-bottom-color:var(--pn-hair); }

/* optional overlay mode */
.pn-hd--float{ position:fixed; top:0; left:0; right:0; background:transparent; }
.pn-hd--float.pn-hd--scrolled{ background:rgba(11,61,69,.97); }
body.admin-bar .pn-hd--float{ top:32px; }
@media screen and (max-width:782px){ body.admin-bar .pn-hd--float{ top:46px; } }

.pn-hd *,.pn-hd *::before,.pn-hd *::after{ box-sizing:border-box; margin:0; padding:0; }
.pn-hd a{ text-decoration:none; }
.pn-hd button{ background:none; border:0; cursor:pointer; font:inherit; color:inherit; }
.pn-hd :focus-visible{ outline:2px solid var(--pn-gold); outline-offset:3px; border-radius:4px; }

/* immunity from the sitewide search-hiding rule in Additional CSS section 8 */
.pn-hd form,
.pn-hd__panel form{
  display:flex !important; visibility:visible !important; opacity:1 !important;
  pointer-events:auto !important; width:auto !important; height:auto !important;
}
.pn-hd form input[type="search"],
.pn-hd__panel form input[type="search"]{ visibility:visible !important; pointer-events:auto !important; height:auto !important; }

.pn-hd__toggle{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

.pn-hd__in{
  position:relative; z-index:2;
  max-width:1820px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:10px 34px; min-height:72px;
}

.elementor-location-header .e-con,
.elementor-location-header .e-con-inner,
.elementor-location-header .elementor-container,
.elementor-location-header .elementor-widget-wrap,
.elementor-location-header .elementor-widget-html,
.elementor-location-header .elementor-element{
  padding-top:0 !important; padding-bottom:0 !important;
  margin-top:0 !important; margin-bottom:0 !important;
  border-bottom:0 !important;
}

/* ---------- brand ---------- */
.pn-hd__brand{ display:flex; align-items:center; gap:14px; flex:0 0 auto; min-width:0; }
.pn-hd__logo{ width:48px; height:48px; object-fit:contain; display:block; }
.pn-hd__logo--ivory{ display:none; }
.pn-hd__monogram{
  display:none; width:44px; height:44px; border-radius:50%;
  align-items:center; justify-content:center;
  border:1px solid rgba(var(--pn-gold-rgb),.55);
  font-family:var(--pn-head); font-size:17px; color:var(--pn-gold);
  background:radial-gradient(circle at 32% 28%, #1A6E78, var(--pn-sea-3));
}
.pn-hd--noimg .pn-hd__logo{ display:none !important; }
.pn-hd--noimg .pn-hd__monogram{ display:flex; }
.pn-hd__word{
  font-family:var(--pn-head); font-weight:700;
  font-size:clamp(22px,2.4vw,32px); letter-spacing:.10em;
  text-transform:uppercase; white-space:nowrap; line-height:1;
  color:var(--pn-gold);
  transition:color .2s ease;
}
.pn-hd__brand:hover .pn-hd__word{ color:#F0D68F; }
.pn-hd__br{ display:none; }

/* ---------- the menu control ---------- */
.pn-hd__right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; margin-left:auto; }
.pn-hd__menubtn{
  display:inline-flex; align-items:center; gap:13px;
  padding:11px 10px 11px 18px; border-radius:999px;
  border:1px solid rgba(245,241,232,.28);
  color:var(--pn-ink); cursor:pointer;
  transition:color .2s ease, background .2s ease, border-color .2s ease;
}
.pn-hd__menubtn:hover{ background:var(--pn-lagoon); color:var(--pn-ink); border-color:var(--pn-ink); }
.pn-hd__menuwords{ font-size:14px; font-weight:600; letter-spacing:.20em; text-transform:uppercase; line-height:1; }
.pn-hd__menuword--close{ display:none; }
.pn-hd__toggle:checked ~ .pn-hd__in .pn-hd__menuword--open{ display:none; }
.pn-hd__toggle:checked ~ .pn-hd__in .pn-hd__menuword--close{ display:inline; }

.pn-hd__burger{ position:relative; width:30px; height:20px; flex:0 0 auto; }
.pn-hd__burger span{
  position:absolute; left:0; right:0; height:2px; border-radius:2px;
  background:currentColor; transition:transform .3s ease, opacity .2s ease, top .3s ease, width .3s ease;
}
.pn-hd__burger span:nth-child(1){ top:3px; }
.pn-hd__burger span:nth-child(2){ top:9px; width:70%; }
.pn-hd__burger span:nth-child(3){ top:15px; }
.pn-hd__menubtn:hover .pn-hd__burger span:nth-child(2){ width:100%; }
.pn-hd__toggle:checked ~ .pn-hd__in .pn-hd__burger span:nth-child(1){ top:9px; transform:rotate(45deg); }
.pn-hd__toggle:checked ~ .pn-hd__in .pn-hd__burger span:nth-child(2){ opacity:0; }
.pn-hd__toggle:checked ~ .pn-hd__in .pn-hd__burger span:nth-child(3){ top:9px; transform:rotate(-45deg); }

/* optional bar items: add pn-hd--withcta or pn-hd--withcart to the header tag */
.pn-hd__cta,
.pn-hd__cart{ display:none; }
.pn-hd svg{ width:19px; height:19px; }
.pn-hd svg path,.pn-hd svg circle{ stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
@media (min-width:900px){
  .pn-hd--withcart .pn-hd__cart{
    display:inline-flex; align-items:center; justify-content:center;
    position:relative; width:42px; height:42px; border-radius:50%;
    color:var(--pn-ink); transition:background .2s ease;
  }
  .pn-hd--withcart .pn-hd__cart:hover{ background:var(--pn-lagoon); }
  .pn-hd--withcta .pn-hd__cta{
    display:inline-flex; align-items:center; margin-right:6px;
    padding:12px 20px; border-radius:999px;
    background:var(--pn-gold); color:var(--pn-on-gold);
    font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap;
    transition:background .2s ease;
  }
  .pn-hd--withcta .pn-hd__cta:hover{ background:#F0D68F; }
}
.pn-hd__cartbadge{
  position:absolute; top:0; right:-2px; display:none;
  min-width:18px; height:18px; padding:0 4px; border-radius:999px;
  background:var(--pn-gold); color:var(--pn-on-gold);
  font-size:11px; font-weight:700; line-height:18px; text-align:center;
  box-shadow:0 0 0 2px var(--pn-sea);
}

/* ---------- the panel ---------- */
.pn-hd__panel{
  display:none; position:fixed; z-index:1;
  top:0; left:0; right:0; bottom:0; padding:104px 34px 56px;
  background:
    radial-gradient(60% 40% at 50% 0%, rgba(255,214,140,.14) 0%, transparent 70%),
    linear-gradient(180deg,#0F4C5C 0%,#0B3D45 55%,#082A30 100%);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  font-family:var(--pn-head);
}
.pn-hd__toggle:checked ~ .pn-hd__panel{ display:block; }
html:has(.pn-hd__toggle:checked){ overflow:hidden; }

.pn-hd__panelin{ max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:38px; }

.pn-hd__mmenu{ list-style:none; }
.pn-hd__mmenu > li{ border-bottom:1px solid var(--pn-hair); }
.pn-hd__mmenu > li:last-child{ border-bottom:0; }
.pn-hd__mrow{ display:flex; align-items:center; justify-content:space-between; }

/* each destination carries the earth of its homepage section */
.pn-hd__mmenu > li > a,
.pn-hd__mlabel{
  display:flex; align-items:center; gap:16px;
  padding:15px 4px; color:var(--pn-ink);
  font-family:var(--pn-head); font-weight:600;
  font-size:clamp(20px,2.8vw,32px); letter-spacing:.06em; line-height:1.1;
  text-transform:uppercase;
  transition:color .18s ease;
}
.pn-hd__mmenu > li > a::before,
.pn-hd__mlabel::before{
  content:""; flex:none; width:14px; height:14px; border-radius:50%;
  background:var(--e,#F5F1E8);
  box-shadow:0 0 0 2px rgba(245,241,232,.85);
  transition:transform .25s ease;
}
.pn-hd__mmenu > li > a:hover{ color:#F0D68F; }
.pn-hd__mmenu > li > a:hover::before{ transform:scale(1.3); }

.pn-hd__mcaret{
  width:52px; height:52px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--pn-ink); border-radius:8px; cursor:pointer; flex:0 0 auto;
}
.pn-hd__mcaret svg{ width:13px; height:13px; transition:transform .3s ease; }
.pn-hd__msub{
  list-style:none; overflow:hidden; max-height:0; transition:max-height .35s ease;
  padding-left:30px; margin:0 0 0 4px;
}
.pn-hd__msub a{
  display:block; padding:12px 4px;
  font-family:var(--pn-head); font-size:14px; font-weight:600;
  text-transform:uppercase; letter-spacing:.14em; color:var(--pn-ink-dim);
  transition:color .18s ease;
}
.pn-hd__msub a:hover{ color:var(--pn-ink); }
.pn-hd__subtoggle{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
.pn-hd__subtoggle:checked ~ .pn-hd__msub{ max-height:340px; }
.pn-hd__subtoggle:checked ~ .pn-hd__mrow .pn-hd__mcaret svg{ transform:rotate(180deg); }

/* ---------- the panel side column ---------- */
.pn-hd__side{ display:flex; flex-direction:column; gap:16px; }
.pn-hd svg.pn-hd__laurel{ display:block; width:120px; height:60px; color:var(--pn-gold); }
.pn-hd svg.pn-hd__laurel path{ fill:currentColor; stroke:none; }

svg[class*="laurel"]:not([data-pn-cup]) > *{ display:none !important; }
.pn-hd__msearch{ display:flex; }
.pn-hd__msearch input{
  flex:1; min-width:0; padding:14px 18px; border-radius:999px 0 0 999px;
  background:rgba(245,241,232,.10); color:var(--pn-ink);
  border:1px solid rgba(245,241,232,.26); border-right:0;
  font-family:var(--pn-body); font-size:16px;
}
.pn-hd__msearch input::placeholder{ color:var(--pn-ink-low); }
.pn-hd__msearch input:focus{ outline:none; border-color:var(--pn-ink); }
.pn-hd__msearch button{
  padding:0 20px; border-radius:0 999px 999px 0;
  border:1px solid rgba(245,241,232,.26); border-left:0; color:var(--pn-ink);
  display:inline-flex; align-items:center;
}
.pn-hd__mcta{
  text-align:center; padding:16px 22px; border-radius:999px;
  background:var(--pn-gold); color:var(--pn-on-gold);
  font-family:var(--pn-head); font-size:14px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase;
  box-shadow:0 12px 30px rgba(var(--pn-gold-rgb),.28);
  transition:background .2s ease;
}
.pn-hd__mcta:hover{ background:#F0D68F; }
.pn-hd__mcart{
  text-align:center; color:var(--pn-ink-dim);
  font-family:var(--pn-head); font-size:14px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; transition:color .18s ease;
}
.pn-hd__mcart:hover{ color:var(--pn-ink); }

@media (min-width:900px){
  .pn-hd__panelin{
    grid-template-columns:minmax(0,1.3fr) minmax(0,.85fr); gap:72px;
    min-height:calc(100vh - 200px); align-content:center;
  }
  .pn-hd__mcaret{ display:none; }
  .pn-hd__msub,
  .pn-hd__subtoggle:checked ~ .pn-hd__msub{
    max-height:none; overflow:visible;
    display:flex; flex-wrap:wrap; gap:0 26px;
    padding:0 0 14px 34px; margin:0;
  }
  .pn-hd__msub a{ padding:6px 0; }
  .pn-hd__mmenu > li > a,.pn-hd__mlabel{ padding:16px 4px 12px; }
  .pn-hd__side{ gap:18px; padding-left:40px; border-left:1px solid var(--pn-hair); justify-content:center; }
}

@media (max-width:1180px){
  .pn-hd__in{ padding:9px 24px; min-height:68px; }
  .pn-hd__logo{ width:44px; height:44px; }
  .pn-hd__panel{ padding-left:24px; padding-right:24px; }

<script>
(function(){
  var hd = document.getElementById('pn-hd');
  if(!hd) return;
  var toggle = document.getElementById('pn-hd-toggle');
  var panel  = document.getElementById('pn-hd-panel');
  var menubtn = hd.querySelector('.pn-hd__menubtn');

  function onScroll(){
    hd.classList.toggle('pn-hd--scrolled', (window.scrollY||document.documentElement.scrollTop) > 8);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  function syncPanel(){
    var open = !!(toggle && toggle.checked);
    document.documentElement.style.overflow = open ? 'hidden' : '';
    document.body.style.overflow = open ? 'hidden' : '';
    if(menubtn) menubtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  if(toggle) toggle.addEventListener('change', syncPanel);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && toggle && toggle.checked){ toggle.checked = false; syncPanel(); }
  });

  if(panel){
    panel.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a') : null;
      if(a && toggle){ toggle.checked = false; syncPanel(); }
    });
  }

  var labels = hd.querySelectorAll('label[for][tabindex]');
  for(var i=0;i<labels.length;i++){
    labels[i].addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); this.click(); }
    });
  }


  function setCount(n){
    var badge = hd.querySelector('.pn-hd__cartbadge');
    if(badge){ badge.textContent = n; badge.style.display = n > 0 ? 'block' : 'none'; }
    var mc = panel ? panel.querySelector('.pn-hd__mcartcount') : null;
    if(mc) mc.textContent = n > 0 ? ' (' + n + ')' : '';
  }
  function readCart(url, thenTry){
    fetch(url, {credentials:'same-origin'})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){ if(d && typeof d.items_count === 'number') setCount(d.items_count); })
      .catch(function(){ if(thenTry) readCart(thenTry, null); });
  }
  /* v18.7: WooCommerce sets this cookie only while the cart holds something */
  function hasCart(){ return /(^|;\s*)woocommerce_items_in_cart=1/.test(document.cookie); }
  function updateCart(force){
    if(typeof window.__PN_PREVIEW_CART === 'number'){ setCount(window.__PN_PREVIEW_CART); return; }
    if(!window.fetch) return;
    if(force !== true && !hasCart()){ setCount(0); return; }
    readCart('/wp-json/wc/store/v1/cart', '/?rest_route=/wc/store/v1/cart');
  }
  updateCart();
  window.addEventListener('pageshow', function(e){
    if(e.persisted){
      if(toggle && toggle.checked){ toggle.checked = false; }
      syncPanel();
      updateCart();
    }
  });
  if(window.jQuery){
    window.jQuery(document.body).on(
      'added_to_cart removed_from_cart updated_cart_totals wc_fragments_refreshed wc_fragments_loaded',
      function(){ updateCart(true); });
  }
})();
</script>

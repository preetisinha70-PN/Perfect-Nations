v6.3: the close button of every pop-up is one design: a gold X drawn as two strokes, centred in a circle (the Steward-General, 9 Nov 2026).
v6.2 (homepage v11.4): on laptops the portrait cards are about a fifth smaller (262 px wide, square portraits, a
softer shadow), so the paintings sit more quietly in the band. Phones are unchanged.
v6.1: homepage v8.1. Each featured nation is shown by its own nation portrait from Art of Nations
(The Trident in Bloom, Mount Kenya in Bloom, The Hindu Kush in Bloom, DR Congo in Bloom, India in
Bloom, Angola in Bloom; the 768 px copies the blueprints already use), in place of six unrelated
photographs (a beach, Kilimanjaro, a mountain, a gorilla, a building, a rock face), two of them at
full size. One kind of picture for one kind of card, and the portraits lead to the paintings.
v6.0: homepage v8.0 (the site made simple). The section follows "How it works" (the three steps),
as the proof: every step, drawn nation by nation. The five moves have left the homepage, so the gold
chapter mark 03 and its link back to them are removed; the eyebrow reads "Nation by nation" with its
hairline. Nothing else changes: cards, live count and summary panel are as in v5.2.
v5.2: fewer words: the lead line is removed; the title and the live count say it.
v5.1: Earthrise ground (was laterite), as the whole homepage keeps one palette.
One Elementor Custom HTML widget, Full Width, padding 0. Served live from GitHub
(pages/home-blueprints.html) by the Perfect Nations Live Pages plugin, in place of the pasted v4
(root id pn-featured).
v5.0: the third of the five moves, Co-Design. The eyebrow carries the gold chapter mark 03, which
leads back to the five moves in The ReDesign Studio. Under the title, a live count of open
blueprints, read from the GitHub list of live pages (pages/manifest.json); 44 shows if the list
cannot be read. Compact padding, as the design system. Phones have their own layout and never
scroll sideways: the six nations in two columns of smaller cards, the button below them across
the full width. The rail and its arrows stay on laptops and tablets. The summary panel is unchanged.
Place this widget below Perfect Capita (the order of the moves); the ReDesign Studio widget moves
it there in the browser if it still sits above Sovereign Assets.

<script>
(function(){
  var root = document.getElementById('pn-featured');
  if (!root || root.getAttribute('data-rail') === '1') { return; }
  root.setAttribute('data-rail', '1');
  var track = root.querySelector('.pnfb-track');
  if (!track) { return; }
  var soft = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var prev = root.querySelector('.pnfb-arrow--p');
  var next = root.querySelector('.pnfb-arrow--n');
  function step(dir){
    var c = track.querySelector('.pnfb-card');
    var by = c ? c.offsetWidth + 18 : track.clientWidth * 0.8;
    track.scrollBy({ left: by * dir, behavior: soft ? 'smooth' : 'auto' });
  }
  function mark(){
    var max = track.scrollWidth - track.clientWidth;
    if (prev) { prev.hidden = track.scrollLeft < 8; }
    if (next) { next.hidden = track.scrollLeft > max - 8; }
  }
  var tick = null;
  track.addEventListener('scroll', function(){
    if (tick) { return; }
    tick = window.requestAnimationFrame(function(){ tick = null; mark(); });
  });
  window.addEventListener('resize', mark);
  if (prev) { prev.addEventListener('click', function(){ step(-1); }); }
  if (next) { next.addEventListener('click', function(){ step(1); }); }
  track.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  });
  mark();
})();
</script>
<script>
(function(){
  var root = document.getElementById('pn-featured');
  var modal = document.getElementById('pnfbModal');
  if (!root || !modal || root.getAttribute('data-modal') === '1') { return; }
  root.setAttribute('data-modal', '1');
  var $ = function(id){ return document.getElementById(id); };
  var opener = null;
  function open(card){
    opener = card;
    $('pnfbModalName').textContent = card.getAttribute('data-name') || '';
    $('pnfbModalRegion').textContent = card.getAttribute('data-region') || '';
    $('pnfbModalHolds').textContent = card.getAttribute('data-holds') || '';
    $('pnfbModalGo').setAttribute('href', card.getAttribute('data-href') || 'https://perfectnations.org/blueprints/');
    $('pnfbModalPh').style.backgroundImage = 'url(' + JSON.stringify(card.getAttribute('data-img') || '') + ')';
    var flag = card.querySelector('.pnfb-flag__svg');
    $('pnfbModalFlag').innerHTML = flag ? flag.outerHTML : '';
    modal.hidden = false;
    window.requestAnimationFrame(function(){ modal.classList.add('is-open'); });
    $('pnfbClose').focus();
  }
  function close(){
    modal.classList.remove('is-open');
    window.setTimeout(function(){ modal.hidden = true; }, 280);
    if (opener) { opener.focus(); opener = null; }
  }
  root.querySelector('.pnfb-track').addEventListener('click', function(e){
    var card = e.target.closest ? e.target.closest('.pnfb-card') : null;
    if (card) { open(card); }
  });
  $('pnfbClose').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if (e.target === modal) { close(); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) { close(); } });
})();

(function(){
  var el = document.getElementById('pnfbCount');
  if (!el || !window.fetch) { return; }
  fetch('https://raw.githubusercontent.com/preetisinha70-PN/perfect-nations/main/pages/manifest.json', { cache: 'no-cache' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || !d.pages) { return; }
      var n = 0;
      Object.keys(d.pages).forEach(function(k){ if (/^pn-bp-[a-z-]+$/.test(k)) { n++; } });
      if (n > 0) { el.textContent = String(n); }
    })
    .catch(function(){});
})();
</script>

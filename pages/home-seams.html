<!-- ===========================================================================
PERFECT NATIONS - HOMEPAGE - THE PAINTED SEAMS - v1.0 - 2026-11-06
The seams between the homepage sections: a slim ivory strip of canvas carrying motifs from
Preeti Sinha's garden painting (a fern frond, dotted leaves, coral flowers, striped seed pods, a red
feather, a yellow bowl, a petal rosette, blue dots, loops, dashes and a rayed sun). The sections
themselves keep one palette (Earthrise and ivory, with gold for what a visitor can act on); the
painting brings the colour, in the seams only.
This part holds the drawings once (the symbols) and the strip style. The homepage build
(tools/build_home.py) places a seam between sections with <div class="pn-seam pn-seam--a">...;
the arrangement of each seam is written by the build, so every seam differs.
The ids here start "pns-", so the Live Pages plugin never mistakes them for a page.
=========================================================================== -->

<script>
(function(){
  if (window.__pnSeams) { return; }
  window.__pnSeams = 1;
  function run(){
    var seams = document.querySelectorAll('.pn-seam');
    if (!seams.length) { return; }
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still || !('IntersectionObserver' in window)) { return; }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){ if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, { threshold: 0.3 });
    Array.prototype.forEach.call(seams, function(s){
      var uses = s.querySelectorAll('svg > g');
      Array.prototype.forEach.call(uses, function(u, i){ u.style.transitionDelay = (i * 0.05) + 's'; });
      s.classList.add('is-armed'); io.observe(s);
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); } else { run(); }
})();
</script>

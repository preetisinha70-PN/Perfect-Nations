<!-- ===========================================================================
PERFECT NATIONS - HOMEPAGE - SECTION 01b - THE CAPITAL WIRE - v2.0 - 2026-11-06
Replaces the Dispatch Ticker (v1.2). Same place: its own Elementor HTML widget directly
UNDER Section 01 (the golden planet). Same root id, pn-tick, so the Perfect Nations Live
Pages plugin serves this file in place of the widget already on the homepage.
What it shows: the most striking capital markets deals on the State of Nations wire, as a
moving tape. Each deal: the nation, the sourced headline figure in gold, what it is, and a
signal (Record, First, Oversubscribed, Innovative). Tap a deal: its card opens under the
tape with the headline as published, the source, "Read the source" and "Find on the
planet", which turns the homepage planet to that nation and pins it with gold rings
and the deal figure.
Live by itself: after the page has loaded, it reads data/ticker.json (about 5 KB) from
the GitHub repository preetisinha70-PN/perfect-nations, kept by the Correspondent at
8 am and 8 pm New York time. The read is kept for 30 minutes in the visitor&#8217;s browser.
If the file cannot be read, the deals built into this widget show.
Fast: the motion is one CSS transform (no script runs while it moves); it stops when the
tape is off screen or the tab is hidden; visitors who ask for reduced motion get a still
row they can scroll. No libraries, no images, no fonts of its own.
EDITORIAL: "Find on the planet" needs Section 01 v5.4 or later (window.pnhgFocus). With an
earlier Section 01 the button still scrolls up to the planet.
=========================================================================== -->

  var STORE = 'pnCwV20', KEEP_MS = 30 * 60 * 1000;
  var items = [], current = -1;

  function phone(){ return window.matchMedia && window.matchMedia('(max-width:640px)').matches; }
  function reduced(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function day(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? (parseInt(m[3], 10) + ' ' + MONTHS[parseInt(m[2], 10) - 1]) : '';
  }
  function okUrl(u){ return typeof u === 'string' && u.indexOf('https://') === 0 && u.indexOf('?') < 0; }

  /* a file that breaks the format is ignored, so the tape never shows a broken deal */
  function clean(d){
    if (!d || d.page !== 'ticker' || !Array.isArray(d.items)) { return null; }
    var out = [];
    for (var i = 0; i < d.items.length && out.length < 12; i++){
      var x = d.items[i];
      if (!x || !x.nation || !x.figure || !x.line || !x.title || !x.source || !okUrl(x.url)) { continue; }
      out.push({ date:String(x.date || ''), nation:String(x.nation), slug:String(x.slug || ''), figure:String(x.figure),
                 line:String(x.line), signal:SIGNALS[x.signal] ? x.signal : '', title:String(x.title),
                 source:String(x.source), url:x.url });
    }
    if (out.length < 4) { return null; }
    return { items:out, updated:String(d.updated || ''), edition:String(d.edition || ''),
             deals:d.count && d.count.deals, nations:d.count && d.count.nations };
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text) { e.textContent = text; }
    return e;
  }

  /* the second copy makes the loop seamless; it is hidden from screen readers and the keyboard */
  function loop(){
    var old = track.querySelector('.cw-list[aria-hidden="true"]');
    if (old) { track.removeChild(old); }
    var copy = list.cloneNode(true);
    copy.removeAttribute('id');
    copy.setAttribute('aria-hidden', 'true');
    var b = copy.querySelectorAll('button');
    for (var i = 0; i < b.length; i++) { b[i].setAttribute('tabindex', '-1'); }
    track.appendChild(copy);
    var w = list.getBoundingClientRect().width;
    if (w > 0) { root.style.setProperty('--speed', Math.max(30, Math.round(w / (phone() ? 34 : 46))) + 's'); }
  }

  function counts(data){
    var cnt = (data.deals > 0 && data.nations > 0) ? (data.deals + ' deals \u00b7 ' + data.nations + ' nations') : '';
    var upd = data.updated ? ('Updated ' + day(data.updated) + (data.edition ? ', ' + data.edition : '')) : '';
    var c = root.querySelectorAll('.cw-cnt'), u = root.querySelectorAll('.cw-upd'), k;
    for (k = 0; k < c.length; k++) { if (cnt) { c[k].textContent = cnt; } }
    for (k = 0; k < u.length; k++) { if (upd) { u[k].textContent = upd; } }
  }

  function render(data){
    items = data.items;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < items.length; i++){
      var x = items[i], li = el('li'), b = el('button', 'cw-i');
      b.type = 'button';
      b.setAttribute('data-i', String(i));
      b.setAttribute('aria-label', x.nation + ', ' + x.figure + ', ' + x.line + (x.signal ? ', ' + x.signal : '') + '. Open the deal');
      b.appendChild(el('span', 'cw-n', x.nation));
      b.appendChild(el('span', 'cw-f', x.figure));
      b.appendChild(el('span', 'cw-l', x.line));
      if (x.signal) { b.appendChild(el('span', 'cw-s', x.signal)); }
      li.appendChild(b); frag.appendChild(li);
    }
    list.innerHTML = '';
    list.appendChild(frag);
    counts(data);
    if (current >= 0) { close(); }
    loop();
  }

  function planetKnows(slug){
    try { return !!(slug && window.PNHG_CFG && window.PNHG_CFG.nations && window.PNHG_CFG.nations[slug]); } catch (e) { return false; }
  }

  function open(i){
    var x = items[i]; if (!x) { return; }
    current = i;
    card.querySelector('.cw-kn').textContent = x.nation;
    card.querySelector('.cw-kf').textContent = x.figure;
    card.querySelector('.cw-kd').textContent = day(x.date);
    card.querySelector('.cw-ks').textContent = x.signal;
    card.querySelector('.cw-h').textContent = x.title;
    card.querySelector('.cw-by').textContent = 'Reported by ' + x.source;
    goLink.href = x.url;
    goLink.setAttribute('aria-label', 'Read the source at ' + x.source + ' (opens in a new tab)');
    findBtn.hidden = !planetKnows(x.slug);
    var on = root.querySelectorAll('.cw-i.is-on');
    for (var k = 0; k < on.length; k++) { on[k].classList.remove('is-on'); }
    var mine = root.querySelectorAll('.cw-i[data-i="' + i + '"]');
    for (k = 0; k < mine.length; k++) { mine[k].classList.add('is-on'); }
    root.classList.add('is-card');
  }
  function close(){
    current = -1;
    root.classList.remove('is-card');
    var on = root.querySelectorAll('.cw-i.is-on');
    for (var k = 0; k < on.length; k++) { on[k].classList.remove('is-on'); }
  }

  track.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.cw-i') : null;
    if (!b) { return; }
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (i === current) { close(); } else { open(i); }
  });
  card.querySelector('.cw-x').addEventListener('click', close);
  root.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && current >= 0) { close(); } });

  /* Find on the planet: up to the golden planet, which turns to the nation and rings it */
  findBtn.addEventListener('click', function(){
    var x = items[current]; if (!x) { return; }
    var band = document.getElementById('pnhgGlobe') || document.getElementById('pn-hero');
    if (band && band.scrollIntoView) {
      try { band.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); } catch (e) { band.scrollIntoView(); }
    }
    setTimeout(function(){
      if (typeof window.pnhgFocus === 'function') { try { window.pnhgFocus(x.slug, x.figure); } catch (e) {} }
    }, reduced() ? 0 : 650);
  });

  pauseBtn.addEventListener('click', function(){
    var p = root.classList.toggle('is-paused');
    pauseBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
    pauseBtn.setAttribute('aria-label', p ? 'Play the Capital Wire' : 'Pause the Capital Wire');
  });

  /* no motion off screen or in a hidden tab */
  var seen = true;
  function sync(){ root.classList.toggle('is-off', !seen || document.hidden); }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(en){ seen = en[0].isIntersecting; sync(); }, { rootMargin: '80px 0px' }).observe(root);
  }
  document.addEventListener('visibilitychange', sync);

  /* the deals built into this widget, until the live file arrives */
  try {
    var seed = clean(JSON.parse(document.getElementById('pnCwSeed').textContent));
    if (seed) { items = seed.items; }
  } catch (e) {}
  loop();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(loop); }
  var rz = null, lastW = window.innerWidth;
  window.addEventListener('resize', function(){
    if (window.innerWidth === lastW) { return; }
    lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(loop, 200);
  });

  function remember(d){ try { window.sessionStorage.setItem(STORE, JSON.stringify({ at: Date.now(), d: d })); } catch (e) {} }
  function kept(){
    try {
      var k = JSON.parse(window.sessionStorage.getItem(STORE) || 'null');
      if (k && k.at && (Date.now() - k.at) < KEEP_MS) { return clean(k.d); }
    } catch (e) {}
    return null;
  }
  function same(a){
    if (!a || a.items.length !== items.length) { return false; }
    for (var i = 0; i < a.items.length; i++) { if (a.items[i].url !== items[i].url || a.items[i].figure !== items[i].figure) { return false; } }
    return true;
  }
  /* the same deals keep their place on the tape; only the counts change */
  function apply(d){ if (!d) { return; } if (same(d)) { counts(d); } else { render(d); } }

  /* the live file is read only after the page has loaded, so the planet loads first */
  function fetchLive(){
    var k = kept();
    if (k) { apply(k); return; }
    if (!window.fetch) { return; }
    var urls = [root.getAttribute('data-src'), root.getAttribute('data-mirror')];
    (function get(n){
      if (n >= urls.length || !urls[n]) { return; }
      fetch(urls[n], { cache: 'no-cache' }).then(function(r){
        if (!r.ok) { throw new Error(String(r.status)); }
        return r.json();
      }).then(function(raw){
        var d = clean(raw);
        if (!d) { throw new Error('format'); }
        remember(raw); apply(d);
      }).catch(function(){ get(n + 1); });
    })(0);
  }
  function later(){
    if ('requestIdleCallback' in window) { window.requestIdleCallback(fetchLive, { timeout: 3000 }); }
    else { setTimeout(fetchLive, 1200); }
  }
  if (document.readyState === 'complete') { later(); } else { window.addEventListener('load', later); }
})();
</script>
